name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ruby: ["3.2", "3.3", "3.4", "4.0", head]
        include:
          - os: macos-latest
            ruby: "4.0"
    continue-on-error: ${{ matrix.ruby == 'head' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - uses: browser-actions/setup-chrome@v2
        if: runner.os != 'macOS'
        id: chrome
      - name: Use the signed Chrome app on macOS
        if: runner.os == 'macOS'
        run: |
          "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version
          echo 'BROWSER_PATH=/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' >> "$GITHUB_ENV"
      - name: Use downloaded Chrome on Linux
        if: runner.os == 'Linux'
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: echo "BROWSER_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Specs, including the Chrome end-to-end specs
        run: bundle exec rake e2e
      - name: Save coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-ruby-${{ matrix.ruby }}
          path: coverage/
          retention-days: 14
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.ruby == '4.0'
        uses: codecov/codecov-action@v7
        with:
          files: coverage/coverage.json
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rubocop

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - run: gem build vcr-browser-proxy.gemspec
      - run: gem install --no-document ./vcr-browser-proxy-*.gem
      - name: Smoke test the installed gem outside the checkout
        working-directory: /tmp
        run: ruby -rvcr_browser_proxy -e 'VcrBrowserProxy.open { |proxy| puts proxy.class }'
      - uses: actions/upload-artifact@v7
        with:
          name: gem
          path: "*.gem"

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rake bench
